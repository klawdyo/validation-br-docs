 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 8</text><line x1="366" y1="786" x2="634" y2="786" stroke="#D1D5DB" /><rect x="364" y="796" width="272" height="30" rx="7" fill="#EFF6FF" /><text x="500" y="816" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 48</text><text x="780" y="740" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">9</text><text x="780" y="772" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 9</text><line x1="646" y1="786" x2="914" y2="786" stroke="#D1D5DB" /><rect x="644" y="796" width="272" height="30" rx="7" fill="#EFF6FF" /><text x="780" y="816" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 81</text><text x="80" y="860" font-family="Consolas, monospace" font-size="14" fill="#374151">SOMA: 7 + 48 + 81 = 136</text><rect x="80" y="890" width="260" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="210" y="924" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#111827">136 &#247; 11</text><line x1="104" y1="938" x2="316" y2="938" stroke="#D1D5DB" /><text x="210" y="966" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#374151">quociente = 12</text><text x="210" y="994" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8">resto = 4</text><rect x="370" y="890" width="420" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="580" y="922" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">DÍGITO VERIFICADOR = resto direto</text><text x="580" y="964" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#374151">resto = 4</text><