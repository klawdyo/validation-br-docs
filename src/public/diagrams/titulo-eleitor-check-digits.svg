="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 56</text><text x="762.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">8</text><text x="762.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 8</text><line x1="716" y1="306" x2="809" y2="306" stroke="#D1D5DB" /><rect x="714" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="762.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 64</text><text x="867.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">8</text><text x="867.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 9</text><line x1="821" y1="306" x2="914" y2="306" stroke="#D1D5DB" /><rect x="819" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="867.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 72</text><text x="80" y="380" font-family="Consolas, monospace" font-size="14" fill="#374151">SOMA: 10 + 6 + 20 + 0 + 12 + 56 + 64 + 72 = 240</text><rect x="80" y="410" width="260" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="210" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#111827">240 &#247; 11</text><line x1="104" y1="458" x2="316" y2="458" stroke="#D1D5DB" /><text x="210" y="486" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#374151">quociente = 21</text><text x="210" y="514" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8">resto = 9</text><rect x="370" y="410" width="420" height="130" rx="12" fill="#F3F4F