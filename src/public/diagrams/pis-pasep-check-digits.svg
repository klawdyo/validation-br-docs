xt-anchor="middle" font-size="20" font-weight="700" fill="#111827">RESULTADO FINAL</text><text x="500" y="678" text-anchor="middle" font-size="15" fill="#4B5563">O número completo é formado pela base + dígito(s) verificador(es)</text><text x="500" y="732" text-anchor="middle" font-size="38" font-weight="800" fill="#111827">712.82677.38-<tspan fill="#1D4ED8">0</tspan></text><text x="500" y="802" text-anchor="middle" font-size="16" fill="#6B7280">Fonte: validation-br.js.org/pis-pasep</text></svg>