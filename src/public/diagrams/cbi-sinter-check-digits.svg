</defs><rect x="0" y="0" width="1000" height="1046" fill="#F4F7FB" /><text x="500" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">COMO CALCULAR O DÍGITO VERIFICADOR DO CBI/SINTER</text><rect x="40" y="130" width="920" height="182" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="80" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">CONVERSÃO BASE 32 DE CROCKFORD (letras &#8594; número)</text><line x1="80" y1="184" x2="920" y2="184" stroke="#E5E7EB" /><text x="80" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4B5563">Sem I, L, O, U (evitam confusão visual); dígitos 0-9 valem seu próprio número, letras seguem a tabela de Crockford abaixo.</text><rect x="80" y="220" width="195" height="72" rx="10" fill="#FAFAFA" stroke="#E5E7EB" /><text x="177.5" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#111827">0-9</text><text x="177.5" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#6B7280">próprio valor</text><rect x="295" y="220" width="195" height="72" rx="10" fill="#FAFAFA" stroke="#E5E7EB" /><text x="392.5" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#1D4ED8">D</text><text x="392.5" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#6B7280">13</text><rect x="510" y="220" width="195" height="72" rx="10" fill="#FAFAFA" stroke="#E5E7EB" /><text x="607.5" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#1D4ED8">N</text><text x="607.5" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#6B7280">21</text><rect x="725" y="220" width="195" height="72" rx="10" fill="#FAFAFA" stroke="#E5E7EB" /><text x="822.5" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#1D4ED8">R</text><text x="822.5" y="274" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#6B7280">24</text><rect x="40" y="342" width="920" height="464" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="80" y="384" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">CÁLCULO DO DÍGITO VERIFICADOR (MÓDULO 31)</text><line x1="80" y1="396" x2="920" y2="396" stroke="#E5E7EB" /><text x="80" y="422" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4B5563">Dígitos usados: os 7 caracteres da base, já convertidos pra Crockford</text><text x="140" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">4</text><text x="140" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9CA3AF">= 4</text><text x="140" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 4</text><line x1="85" y1="538" x2="195" y2="538" stroke="#D1D5DB" /><rect x="84" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="140" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 16</text><text x="260" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">1</text><text x="260" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9CA3AF">= 1</text><text x="260" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 3</text><line x1="205" y1="538" x2="315" y2="538" stroke="#D1D5DB" /><rect x="204" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="260" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 3</text><text x="380" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">D</text><text x="380" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1D4ED8">crock. 13</text><text x="380" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 9</text><line x1="325" y1="538" x2="435" y2="538" stroke="#D1D5DB" /><rect x="324" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="380" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 117</text><text x="500" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">N</text><text x="500" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1D4ED8">crock. 21</text><text x="500" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 5</text><line x1="445" y1="538" x2="555" y2="538" stroke="#D1D5DB" /><rect x="444" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="500" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 105</text><text x="620" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">R</text><text x="620" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1D4ED8">crock. 24</text><text x="620" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 7</text><line x1="565" y1="538" x2="675" y2="538" stroke="#D1D5DB" /><rect x="564" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="620" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 168</text><text x="740" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">4</text><text x="740" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9CA3AF">= 4</text><text x="740" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 1</text><line x1="685" y1="538" x2="795" y2="538" stroke="#D1D5DB" /><rect x="684" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="740" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 4</text><text x="860" y="472" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">3</text><text x="860" y="498" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9CA3AF">= 3</text><text x="860" y="524" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#6B7280">&#215; 8</text><line x1="805" y1="538" x2="915" y2="538" stroke="#D1D5DB" /><rect x="804" y="548" width="112" height="30" rx="7" fill="#EFF6FF" /><text x="860" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 24</text><text x="80" y="610" font-family="Consolas, monospace" font-size="14" fill="#374151">SOMA: 16 + 3 + 117 + 105 + 168 + 4 + 24 = 437</text><rect x="80" y="636" width="260" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="210" y="670" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#111827">437 &#247; 31</text><line x1="104" y1="684" x2="316" y2="684" stroke="#D1D5DB" /><text x="210" y="712" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#374151">quociente = 14</text><text x="210" y="740" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8">resto = 3</text><rect x="370" y="636" width="420" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="580" y="668" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">DV = resto convertido p/ Crockford</text><text x="580" y="710" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#374151">3 &#8594; '3'</text><text x="580" y="740" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9CA3AF">(resto máximo é 30 = 'Y'; o DV nunca é 'Z')</text><path d="M 802 701 L 832 701" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrow)" /><circle cx="870" cy="701" r="34" fill="#1D4ED8" /><text x="870" y="711" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text><rect x="40" y="836" width="920" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="500" y="876" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">RESULTADO FINAL</text><text x="500" y="904" text-anchor="middle" font-size="15" fill="#4B5563">O código completo é a base (7) + o dígito verificador</text><text x="500" y="958" text-anchor="middle" font-size="38" font-weight="800" fill="#111827">41DNR43-<tspan fill="#1D4ED8">3</tspan></text><text x="500" y="1028" text-anchor="middle" font-size="16" fill="#6B7280">Fonte: validation-br.js.org/cbi_sinter</text></svg>