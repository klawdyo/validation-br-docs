</defs><rect x="0" y="0" width="1000" height="820" fill="#F4F7FB" /><text x="500" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">COMO CALCULAR O DÍGITO VERIFICADOR (DV) DO CÓDIGO DE RASTREAMENTO POSTAL</text><rect x="40" y="130" width="920" height="450" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="80" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">CÁLCULO DO DÍGITO VERIFICADOR</text><line x1="80" y1="184" x2="920" y2="184" stroke="#E5E7EB" /><text x="80" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4B5563">Dígitos usados: só os 8 do meio (prefixo de 2 letras e país não entram na conta)</text><text x="132.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">7</text><text x="132.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 8</text><line x1="86" y1="306" x2="179" y2="306" stroke="#D1D5DB" /><rect x="84" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="132.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 56</text><text x="237.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">1</text><text x="237.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 6</text><line x1="191" y1="306" x2="284" y2="306" stroke="#D1D5DB" /><rect x="189" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="237.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 6</text><text x="342.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">8</text><text x="342.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 4</text><line x1="296" y1="306" x2="389" y2="306" stroke="#D1D5DB" /><rect x="294" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="342.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 32</text><text x="447.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">2</text><text x="447.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 2</text><line x1="401" y1="306" x2="494" y2="306" stroke="#D1D5DB" /><rect x="399" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="447.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 4</text><text x="552.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">5</text><text x="552.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 3</text><line x1="506" y1="306" x2="599" y2="306" stroke="#D1D5DB" /><rect x="504" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="552.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 15</text><text x="657.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">2</text><text x="657.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 5</text><line x1="611" y1="306" x2="704" y2="306" stroke="#D1D5DB" /><rect x="609" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="657.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 10</text><text x="762.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">4</text><text x="762.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 9</text><line x1="716" y1="306" x2="809" y2="306" stroke="#D1D5DB" /><rect x="714" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="762.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 36</text><text x="867.5" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">2</text><text x="867.5" y="292" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#6B7280">&#215; 7</text><line x1="821" y1="306" x2="914" y2="306" stroke="#D1D5DB" /><rect x="819" y="316" width="97" height="30" rx="7" fill="#EFF6FF" /><text x="867.5" y="336" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="18" font-weight="700" fill="#1D4ED8">= 14</text><text x="80" y="380" font-family="Consolas, monospace" font-size="14" fill="#374151">SOMA: 56 + 6 + 32 + 4 + 15 + 10 + 36 + 14 = 173</text><rect x="80" y="410" width="260" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="210" y="444" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#111827">173 &#247; 11</text><line x1="104" y1="458" x2="316" y2="458" stroke="#D1D5DB" /><text x="210" y="486" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#374151">quociente = 15</text><text x="210" y="514" text-anchor="middle" font-family="Consolas, monospace" font-size="20" font-weight="700" fill="#1D4ED8">resto = 8</text><rect x="370" y="410" width="420" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="580" y="442" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827">DÍGITO VERIFICADOR = 11 - resto</text><text x="580" y="484" text-anchor="middle" font-family="Consolas, monospace" font-size="24" font-weight="700" fill="#374151">11 - 8 = 3</text><text x="580" y="514" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#9CA3AF">(se der 10, o dígito é 0)</text><path d="M 802 475 L 832 475" stroke="#1D4ED8" stroke-width="2.5" marker-end="url(#arrow)" /><circle cx="870" cy="475" r="34" fill="#1D4ED8" /><text x="870" y="485" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text><rect x="40" y="610" width="920" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="500" y="650" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">RESULTADO FINAL</text><text x="500" y="678" text-anchor="middle" font-size="15" fill="#4B5563">O número completo é formado pela base + dígito(s) verificador(es)</text><text x="500" y="732" text-anchor="middle" font-size="38" font-weight="800" fill="#111827">JT71825242<tspan fill="#1D4ED8">3</tspan>BR</text><text x="500" y="802" text-anchor="middle" font-size="16" fill="#6B7280">Fonte: validation-br.js.org/postal-track-code</text></svg>