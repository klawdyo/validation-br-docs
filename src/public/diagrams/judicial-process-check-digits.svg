</defs><rect x="0" y="0" width="1000" height="660" fill="#F4F7FB" /><text x="500" y="48" text-anchor="middle" font-size="24" font-weight="800" fill="#111827">COMO CALCULAR O DÍGITO VERIFICADOR DO PROCESSO JUDICIAL (CNJ)</text><rect x="40" y="130" width="920" height="290" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="80" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">MÓDULO 97 DE BASE 10 (ISO 7064) — CÁLCULO EM 3 ETAPAS</text><line x1="80" y1="184" x2="920" y2="184" stroke="#E5E7EB" /><text x="80" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4B5563">O número tem dígitos demais pro inteiro do JS calcular de uma vez, então o cálculo é fatorado em partes: sequencial (7) + ano/órgão/tribunal (7) + origem (4) + "00" no lugar do DV</text><rect x="80" y="250" width="192" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="176" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">PARTE 1 · sequencial</text><text x="176" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#374151">11006 % 97</text><text x="176" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#374151">45</text><path d="M 276 315 L 292 315" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-gray)" /><rect x="296" y="250" width="192" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="392" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">PARTE 2 · + ano/órgão/tribunal</text><text x="392" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#374151">452016820 % 97</text><text x="392" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#374151">21</text><path d="M 492 315 L 508 315" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-gray)" /><rect x="512" y="250" width="192" height="130" rx="12" fill="#F3F4F6" stroke="#E5E7EB" /><text x="608" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">PARTE 3 · + origem + "00"</text><text x="608" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#374151">21010000 % 97</text><text x="608" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#374151">91</text><path d="M 708 315 L 724 315" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrow-gray)" /><rect x="728" y="250" width="192" height="130" rx="12" fill="#EFF6FF" stroke="#E5E7EB" /><text x="824" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">DÍGITO VERIFICADOR</text><text x="824" y="314" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#374151">98 - 91</text><text x="824" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#1D4ED8">07</text><rect x="40" y="450" width="920" height="150" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" /><text x="500" y="490" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">RESULTADO FINAL</text><text x="500" y="518" text-anchor="middle" font-size="15" fill="#4B5563">O número completo é formado pela base + dígito(s) verificador(es)</text><text x="500" y="572" text-anchor="middle" font-size="38" font-weight="800" fill="#111827">0011006-<tspan fill="#1D4ED8">07</tspan>.2016.8.20.0100</text><text x="500" y="642" text-anchor="middle" font-size="16" fill="#6B7280">Fonte: validation-br.js.org/judicial-process</text></svg>